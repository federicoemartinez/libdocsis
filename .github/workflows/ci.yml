name: CI

on:
  push:
    branches: [master, lib-consolidation]
  pull_request:
  workflow_dispatch:

env:
  DEPS: autoconf automake libtool libsnmp-dev bison flex gcc make

jobs:
  test:
    name: build + make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $DEPS
      - run: ./autogen.sh && ./configure
      - run: make
      - run: make check
      - name: Logs de los tests que fallaron
        if: failure()
        run: |
          for f in examples/test-suite.log tests/test-suite.log tests/RunTests.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
          exit 0

  analyzer:
    name: gcc -fanalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $DEPS
      # configure genera config.h, que los fuentes necesitan
      - run: ./autogen.sh && ./configure
      - name: Analizar los fuentes escritos a mano
        working-directory: src
        run: |
          # -c -o /dev/null y NO -fsyntax-only: con -fsyntax-only el analizador
          # no corre y el silencio parece limpieza.
          # Se excluyen docsis_yy.c y docsis_lex.c: los generan bison y flex.
          for f in docsis.c docsis_encode.c docsis_decode.c docsis_snmp.c \
                   libdocsis.c docsis_main.c ethermac.c hmac_md5.c; do
            echo "--- $f"
            gcc -fanalyzer -Werror -c -o /dev/null -DHAVE_CONFIG_H -I. -I.. \
                $(net-snmp-config --cflags) "$f"
          done

  asan:
    name: AddressSanitizer + LeakSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $DEPS
      - run: ./autogen.sh
      - run: ./configure CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" LDFLAGS="-fsanitize=address"
      - run: make
      # Solo test_api: cubre los caminos de error, que es donde estaba la fuga.
      # Los 142 fixtures bajo ASAN no agregan señal y multiplican el tiempo.
      - name: test_api bajo ASAN
        working-directory: tests
        env:
          MIBDIRS: ../mibs:../mibs/iana:../mibs/ietf
          srcdir: .
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=lsan.supp
        run: make test_api && ./test_api

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends $DEPS valgrind
      - run: ./autogen.sh && ./configure CFLAGS="-g -O0"
      - run: make
      - name: test_api bajo valgrind
        working-directory: tests
        env:
          MIBDIRS: ../mibs:../mibs/iana:../mibs/ietf
          srcdir: .
        run: |
          make test_api
          # --error-exitcode: sin esto valgrind reporta y sale 0, o sea que el
          # job pasaría con errores adentro.
          # definite: net-snmp deja su árbol de MIBs "still reachable" a
          # propósito, así que exigir cero de eso daría un falso positivo.
          valgrind --leak-check=full \
                   --errors-for-leak-kinds=definite \
                   --error-exitcode=9 \
                   ./test_api
